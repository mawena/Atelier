[package]
name = "atelier"
version = "0.1.0"
edition = "2024"
description = "Installe et gère des modèles de langage open source derrière une API compatible OpenAI, dans Docker."
license = "MIT"
authors = ["mawena"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
comfy-table = "8.0.1"
dialoguer = "0.12.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
libc = "0.2.191"
minijinja = { version = "3.0.3", features = ["serde"] }
owo-colors = "4.4.0"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "process", "signal", "time", "sync"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
