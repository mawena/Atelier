name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: shellcheck
        run: find . -name "*.sh" -not -path "./target/*" -exec shellcheck {} +

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Docker Compose est présent sur les runners : le Compose généré y est validé.
      - run: cargo test --all-targets

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: binaire statique
        run: |
          f=target/${{ matrix.target }}/release/atelier
          file "$f"
          file "$f" | grep -Eq "statically linked|static-pie linked"
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/atelier
